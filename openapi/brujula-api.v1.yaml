        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /staff/degree-work-modalities/{modalityId}:
    parameters:
      - $ref: "#/components/parameters/ModalityId"
    patch:
      tags: [Curriculum]
      summary: Editar o archivar una modalidad de trabajo de grado
      operationId: updateDegreeWorkModality
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/DegreeWorkModalityUpdateRequest" }
      responses:
        "200":
          description: Modalidad actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DegreeWorkModality" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }

  # ----------------------------------------------------------------------------
  # OFFERINGS — periods / offerings / schedule options
  # ----------------------------------------------------------------------------
  /periods:
    get:
      tags: [Offerings]
      summary: Listar periodos académicos
      operationId: listPeriods
      parameters:
        - {
            name: status,
            in: query,
            schema: { $ref: "#/components/schemas/PeriodStatus" },
          }
      responses:
        "200":
          description: Periodos académicos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AcademicPeriod" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /offerings:
    get:
      tags: [Offerings]
      summary: Listar ofertas publicadas
      description: El estudiante solo ve ofertas PRELIMINARY/FINAL. Staff/admin pueden ver borradores de sus programas.
      operationId: listOfferings
      parameters:
        - {
            name: periodId,
            in: query,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { name: programId, in: query, schema: { type: string, format: uuid } }
        - { name: courseId, in: query, schema: { type: string, format: uuid } }
        - {
            name: status,
            in: query,
            schema: { $ref: "#/components/schemas/OfferingStatus" },
          }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: Página de ofertas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferingPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /offerings/{offeringId}:
    parameters:
      - $ref: "#/components/parameters/OfferingId"
    get:
      tags: [Offerings]
      summary: Consultar una oferta con sus opciones de horario
      operationId: getOffering
      responses:
        "200":
          description: Oferta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferingDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /staff/programs/{programId}/offerings:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    post:
      tags: [Offerings]
      summary: Crear una oferta de materia por periodo
      description: Solo sobre materias activas y periodos habilitados. Staff con asignación activa. Idempotente.
      operationId: createOffering
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingCreateRequest" }
      responses:
        "201":
          description: Oferta creada en estado DRAFT.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferingDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Oferta duplicada o reuso inválido de `Idempotency-Key`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /staff/offerings/{offeringId}:
    parameters:
      - $ref: "#/components/parameters/OfferingId"
    patch:
      tags: [Offerings]
      summary: Editar una oferta
      description: Modificar una oferta ya seleccionada marca las simulaciones afectadas como desactualizadas. Bloqueo optimista.
      operationId: updateOffering
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingUpdateRequest" }
      responses:
        "200":
          description: Oferta actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferingDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }

  /staff/offerings/{offeringId}/publication:
    parameters:
      - $ref: "#/components/parameters/OfferingId"
    post:
      tags: [Offerings]
      summary: Publicar o archivar una oferta
      description: |
        Transición a PRELIMINARY, FINAL o ARCHIVED. No puede publicarse sin opción de horario
        (RN). Si la suma semanal no coincide con la intensidad curricular, se
        advierte pero no se bloquea. Publicar es acción expresa y
        genera log. Idempotente.
      operationId: publishOffering
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetStatus, version]
              properties:
                targetStatus:
                  { type: string, enum: [PRELIMINARY, FINAL, ARCHIVED] }
                version: { $ref: "#/components/schemas/Version" }
                acknowledgeIntensityWarning:
                  type: boolean
                  default: false
                  description: Confirma publicar pese a la advertencia de intensidad no coincidente.
      responses:
        "200":
          description: Oferta publicada/archivada; simulaciones afectadas marcadas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferingDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422":
          description: No puede publicarse sin opción de horario válida.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /staff/offerings/{offeringId}/schedule-options:
    parameters:
      - $ref: "#/components/parameters/OfferingId"
    post:
      tags: [Offerings]
      summary: Agregar una opción de horario
      description: Cada opción tiene jornada y mínimo una sesión; la hora final debe ser posterior a la inicial. El sistema calcula las horas semanales.
      operationId: createScheduleOption
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleOptionCreateRequest" }
      responses:
        "201":
          description: Opción de horario creada.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleOption" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Opción sin sesiones, hora final no posterior a la inicial, o día inválido.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /staff/schedule-options/{optionId}:
    parameters:
      - $ref: "#/components/parameters/OptionId"
    patch:
      tags: [Offerings]
      summary: Editar una opción de horario
      operationId: updateScheduleOption
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleOptionUpdateRequest" }
      responses:
        "200":
          description: Opción actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleOption" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
    delete:
      tags: [Offerings]
      summary: Eliminar una opción de horario (borrador)
      operationId: deleteScheduleOption
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Opción eliminada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No puede eliminarse la última opción de una oferta publicada.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  # ----------------------------------------------------------------------------
  # IMPORTS
  # ----------------------------------------------------------------------------
  /staff/imports:
    get:
      tags: [Imports]
      summary: Listar importaciones del staff
      operationId: listImports
      parameters:
        - {
            name: kind,
            in: query,
            schema: { $ref: "#/components/schemas/ImportKind" },
          }
        - {
            name: status,
            in: query,
            schema: { $ref: "#/components/schemas/ImportStatus" },
          }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: Página de importaciones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Imports]
      summary: Subir un archivo de importación
      description: |
        Sube XLSX o JSON para materias u ofertas. El sistema valida tipo y tamaño (≤5 MB sugerido),
        analiza estructura y devuelve un resumen de registros válidos, advertencias y
        errores **sin publicar nada**. Idempotente para evitar procesamiento
        doble.
      operationId: uploadImport
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [kind, programId, file]
              properties:
                kind: { $ref: "#/components/schemas/ImportKind" }
                programId: { type: string, format: uuid }
                planId:
                  {
                    type: string,
                    format: uuid,
                    description: Requerido para importación de materias/requisitos.,
                  }
                periodId:
                  {
                    type: string,
                    format: uuid,
                    description: Requerido para importación de ofertas.,
                  }
                file:
                  type: string
                  format: binary
                  description: Archivo.xlsx o.json (.xls/.xlsm/.csv no permitidos).
            encoding:
              file:
                contentType: >-
                  application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/json
      responses:
        "201":
          description: Importación recibida en estado borrador con resumen de validación.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Reuso inválido de `Idempotency-Key`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422":
          description: Estructura inválida; el detalle enumera errores y advertencias.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /staff/imports/{importId}:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    get:
      tags: [Imports]
      summary: Consultar el resultado de una importación
      operationId: getImport
      responses:
        "200":
          description: Resumen de la importación con errores y advertencias.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /staff/imports/{importId}/confirmation:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      tags: [Imports]
      summary: Confirmar una importación válida
      description: Guarda los datos como borrador editable (no publica). Genera log. Idempotente.
      operationId: confirmImport
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionedAction" }
      responses:
        "200":
          description: Importación confirmada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: La importación tiene errores y no puede confirmarse, o reuso inválido de `Idempotency-Key`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

