  # ADMINISTRATION
  # ----------------------------------------------------------------------------
  /admin/programs:
    post:
      tags: [Administration]
      summary: Crear un programa académico
      description: Nombre obligatorio; no se permiten dos programas activos idénticos (RN). Solo ADMIN. Genera log.
      operationId: createProgram
