            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffAssignment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Administration]
      summary: Asignar un programa al staff
      operationId: assignProgramToStaff
