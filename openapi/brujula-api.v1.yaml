openapi: 3.1.0

info:
  title: Brújula — API
  version: 1.0.0
  summary: Contrato REST contract-first para la plataforma de planeación curricular y simulación académica.
  description: |
    Contrato formal (fuente de verdad) de la API REST JSON de Brújula
    (Planificador Curricular, Universidad del Quindío).

    Esta plataforma es una herramienta de **planeación personal**. La información académica
    registrada por el estudiante es **autodeclarada** y **no reemplaza ni certifica** la
    información oficial de la Universidad del Quindío.

    ## Convenciones
    - Ruta base: `/api/v1`.
    - Cuerpos JSON UTF-8.
    - Identificadores: UUID opacos.
    - Fechas/auditoría: ISO 8601 en UTC con zona.
    - Horarios de clase: día de la semana + hora local (`HH:mm`).
    - Errores: `application/problem+json` (RFC 9457) con extensiones `code` y `metadata`.
    - Paginación: `page`, `size`, `sort` con límites.
    - Comandos críticos: cabecera `Idempotency-Key` obligatoria.
    - Concurrencia: bloqueo optimista por `version`; conflicto `409`.
    - Escritura: protección CSRF mediante cabecera `X-XSRF-TOKEN`.
  contact:
    name: Equipo Brújula
  license:
    name: Uso interno de proyecto
    identifier: LicenseRef-Uniquindio-Internal

servers:
  - url: /api/v1
    description: Ruta base relativa (Vite hace proxy de /api hacia Spring Boot en local).

tags:
  - name: Auth
    description: Registro de estudiante, verificación de correo, recuperación y sesión.
  - name: Profile
    description: Perfil del usuario autenticado e historial personal de acciones.
  - name: Subscriptions
    description: Suscripciones de planificación del estudiante (1–2 programas).
  - name: Progress
    description: Avance curricular, intentos cursados y promedios estimados.
  - name: Simulations
    description: Simulaciones, selecciones y motor de validaciones.
  - name: Catalog
    description: Programas, planes de estudio y jornadas (lectura para estudiante).
  - name: Curriculum
    description: Materias, requisitos, electivas, profundizaciones y trabajo de grado (staff).
  - name: Offerings
    description: Periodos, ofertas, opciones de horario y sesiones (staff y lectura publicada).
  - name: Imports
    description: Carga masiva XLSX/JSON con prevalidación (staff).
  - name: Administration
    description: Staff, asignaciones, periodos, límites de créditos y dominios (admin).
  - name: Audit
    description: Eventos de auditoría funcional (admin global, staff por programa).

security:
  - sessionCookie: []

paths:
  # ----------------------------------------------------------------------------
  # AUTH
  # ----------------------------------------------------------------------------
  /auth/registration:
    post:
      tags: [Auth]
      summary: Registrar una cuenta de estudiante
      description: |
        Crea una cuenta de estudiante en estado pendiente de verificación. Solo se aceptan
        correos cuyo dominio esté habilitado. La credencial se delega al
        proveedor de identidad (Keycloak); el backend **no** almacena contraseñas.
        Conserva evidencia de aceptación de términos y tratamiento de datos.

        **CSRF**: aunque el endpoint es público (`security: []`), la protección CSRF está activa
        globalmente (modo SPA). El cliente SPA debe leer la cookie `XSRF-TOKEN` e incluirla
        en la cabecera `X-XSRF-TOKEN` en cada solicitud de escritura (POST/PUT/DELETE/PATCH).
        Una solicitud sin esta cabecera recibirá 403.
      operationId: registerStudent
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentRegistrationRequest"
      responses:
        "202":
          description: Registro aceptado; se envió un correo de verificación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationAccepted"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: |
            Conflicto. Correo ya registrado o dominio no habilitado, o reuso inválido
            de `Idempotency-Key`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # NOTE (S2-A-3 contract audit): /auth/email-verifications/confirm (token-confirm) has been
  # REMOVED. Architecture decision: Keycloak handles email verification natively on its own page.
  # The backend does NOT receive a verification token to confirm. Keycloak verifies the user and
  # sets emailVerified=true; the backend syncs onboardingState PENDING_VERIFICATION→ACTIVE on the
  # next OIDC login (claim email_verified=true). /auth/email-verifications is a RESEND trigger only.
  # Decision recorded: #1574 (Keycloak 26.4 verified API facts).

  /auth/email-verifications/resend:
    post:
      tags: [Auth]
      summary: Reenviar correo de verificación
      description: |
        Solicita el reenvío del correo de verificación de cuenta. Responde siempre 202 para
        no revelar existencia de cuentas.

        **CSRF**: aunque el endpoint es público (`security: []`), la protección CSRF está activa
        globalmente (modo SPA). El cliente SPA debe leer la cookie `XSRF-TOKEN` e incluirla
        en la cabecera `X-XSRF-TOKEN` en cada solicitud de escritura (POST/PUT/DELETE/PATCH).
        Una solicitud sin esta cabecera recibirá 403.
      operationId: resendEmailVerification
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { $ref: "#/components/schemas/InstitutionalEmail" }
      responses:
        "202":
          {
            description: "Si el correo existe y no está verificado, se reenvía el mensaje.",
          }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/password-recovery:
    post:
      tags: [Auth]
      summary: Solicitar recuperación de contraseña
      description: |
        Inicia recuperación mediante enlace temporal a correo verificado. Responde siempre
        202 para no revelar existencia de cuentas.

        **CSRF**: aunque el endpoint es público (`security: []`), la protección CSRF está activa
        globalmente (modo SPA). El cliente SPA debe leer la cookie `XSRF-TOKEN` e incluirla
        en la cabecera `X-XSRF-TOKEN` en cada solicitud de escritura (POST/PUT/DELETE/PATCH).
        Una solicitud sin esta cabecera recibirá 403.
      operationId: requestPasswordRecovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { $ref: "#/components/schemas/InstitutionalEmail" }
      responses:
        "202":
          {
            description: "Si la cuenta existe y está verificada, se envía un enlace de recuperación.",
          }
        "400": { $ref: "#/components/responses/BadRequest" }

  # NOTE (S2-A-3 contract audit): /auth/password-recovery/confirm (token+newPassword) has been
  # REMOVED. Architecture decision: Keycloak handles password reset natively on its own page.
  # The backend does NOT receive or process reset tokens. Flow: POST /auth/password-recovery
  # triggers execute-actions-email [UPDATE_PASSWORD] via Keycloak Admin API; Keycloak sends a link;
  # user clicks link → Keycloak's own reset form → no backend confirm endpoint needed.
  # Decision: Option A (Keycloak-native reset) per S2-A-3 decision. Recorded: #1574.

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión
      description: Invalida la sesión del backend y limpia la cookie de sesión.
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Sesión cerrada. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ----------------------------------------------------------------------------
  # PROFILE
  # ----------------------------------------------------------------------------
  /me:
    get:
      tags: [Profile]
      summary: Perfil del usuario autenticado
      operationId: getCurrentUser
      responses:
        "200":
          description: Perfil del usuario en sesión.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/activity:
    get:
      tags: [Profile]
      summary: Historial personal de acciones del estudiante
      description: Registros propios relevantes (cambios de estado/nota, simulaciones, cambios de programa). Solo lectura.
      operationId: listMyActivity
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - $ref: "#/components/parameters/SortParam"
        - {
            name: from,
            in: query,
            schema: { type: string, format: date-time },
            description: Límite inferior de fecha (UTC).,
          }
        - {
            name: to,
            in: query,
            schema: { type: string, format: date-time },
            description: Límite superior de fecha (UTC).,
          }
      responses:
        "200":
          description: Página de eventos personales.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ----------------------------------------------------------------------------
  # SUBSCRIPTIONS (onboarding)
  # ----------------------------------------------------------------------------
  /me/subscriptions:
    get:
      tags: [Subscriptions]
      summary: Listar suscripciones de planificación del estudiante
      operationId: listMySubscriptions
      responses:
        "200":
          description: Suscripciones activas (entre 1 y 2).
          content:
            application/json:
              schema:
                type: array
                maxItems: 2
                items: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Subscriptions]
      summary: Suscribirse a un programa
      description: |
        Asocia el estudiante a un programa, un plan activo y una jornada de
        referencia. Máximo dos suscripciones activas; el tercer programa se
        rechaza con `409`.
      operationId: createSubscription
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionCreateRequest" }
      responses:
        "201":
          description: Suscripción creada.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Límite de 2 suscripciones superado, programa ya suscrito, o reuso inválido de `Idempotency-Key`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /me/subscriptions/{subscriptionId}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      tags: [Subscriptions]
      summary: Consultar una suscripción
      operationId: getSubscription
      responses:
        "200":
          description: Suscripción.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Subscriptions]
      summary: Cambiar plan o jornada de referencia
      description: Cambiar de plan tras registrar historial requiere confirmación de impacto; genera log. Bloqueo optimista por `version`.
      operationId: updateSubscription
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionUpdateRequest" }
      responses:
        "200":
          description: Suscripción actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422":
          description: Cambio de plan requiere acknowledgeHistoryImpact=true cuando existen intentos de cursos previos.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
    delete:
      tags: [Subscriptions]
      summary: Retirar una suscripción de planificación
      description: Debe quedar al menos una suscripción activa. Conserva log e historial referenciado.
      operationId: deleteSubscription
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Suscripción retirada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No puede retirarse la última suscripción activa.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /me/subscriptions/{subscriptionId}/progress:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      tags: [Progress]
      summary: Resumen de avance y promedios estimados
      description: Créditos aprobados/pendientes, % de avance, promedio histórico y por periodo. Todo etiquetado como estimado y autodeclarado.
      operationId: getSubscriptionProgress
      responses:
        "200":
          description: Resumen de avance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/subscriptions/{subscriptionId}/curriculum:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      tags: [Progress]
      summary: Malla curricular con estado por materia
      description: |
        Materias del plan organizadas por semestre recomendado según la jornada de referencia,
        con el estado curricular del estudiante (PENDING, PASSED, FAILED, CANCELLED, AVAILABLE,
        BLOCKED) y los requisitos cumplidos/faltantes.
      operationId: getSubscriptionCurriculum
      responses:
        "200":
          description: Malla con estado por materia.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurriculumView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ----------------------------------------------------------------------------
  # COURSE ATTEMPTS
  # ----------------------------------------------------------------------------
  /me/course-attempts:
    get:
      tags: [Progress]
      summary: Listar intentos cursados del estudiante
      operationId: listMyCourseAttempts
      parameters:
        - {
            name: subscriptionId,
            in: query,
            schema: { type: string, format: uuid },
            description: Filtrar por suscripción/programa.,
          }
        - {
            name: courseId,
            in: query,
            schema: { type: string, format: uuid },
            description: Filtrar por materia.,
          }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: Página de intentos cursados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseAttemptPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Progress]
      summary: Registrar un intento cursado
      description: |
        Registra que el estudiante cursó una materia. Valida nota según estado:
        PASSED ⇒ 3.0–5.0; FAILED ⇒ 0.0–2.9; CANCELLED ⇒ sin nota.
        Idempotente para evitar doble historial.
      operationId: createCourseAttempt
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseAttemptCreateRequest" }
      responses:
        "201":
          description: Intento registrado; avance recalculado.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseAttempt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Reuso inválido de `Idempotency-Key`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422":
          description: Nota incoherente con el estado.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /me/course-attempts/{attemptId}:
    parameters:
      - $ref: "#/components/parameters/AttemptId"
    get:
      tags: [Progress]
      summary: Consultar un intento cursado
      operationId: getCourseAttempt
      responses:
        "200":
          description: Intento cursado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseAttempt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Progress]
      summary: Editar un intento cursado
      description: Recalcula avance, promedios y validaciones; genera log. Bloqueo optimista por `version`.
      operationId: updateCourseAttempt
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseAttemptUpdateRequest" }
      responses:
        "200":
          description: Intento actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseAttempt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Progress]
      summary: Eliminar un intento cursado
      description: Conserva log del cambio. Recalcula avance y promedios.
      operationId: deleteCourseAttempt
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Intento eliminado. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ----------------------------------------------------------------------------
  # SIMULATIONS
  # ----------------------------------------------------------------------------
  /me/simulations:
    get:
      tags: [Simulations]
      summary: Listar simulaciones del estudiante
      operationId: listMySimulations
      parameters:
        - {
            name: periodId,
            in: query,
            schema: { type: string, format: uuid },
            description: Filtrar por periodo académico.,
          }
        - {
            name: status,
            in: query,
            schema: { $ref: "#/components/schemas/SimulationStatus" },
            description: Filtrar por vigencia.,
          }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: Página de simulaciones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Simulations]
      summary: Crear una simulación
      description: Para un periodo futuro y uno o ambos programas suscritos. Idempotente.
      operationId: createSimulation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulationCreateRequest" }
      responses:
        "201":
          description: Simulación creada.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Simulation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Reuso inválido de `Idempotency-Key`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /me/simulations/{simulationId}:
    parameters:
      - $ref: "#/components/parameters/SimulationId"
    get:
      tags: [Simulations]
      summary: Consultar una simulación con horario y validación
      description: Incluye selecciones, calendario semanal, resumen de créditos por programa y resultado de validación.
      operationId: getSimulation
      responses:
        "200":
          description: Simulación.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Simulations]
      summary: Renombrar o ajustar metadatos de la simulación
      operationId: updateSimulation
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulationUpdateRequest" }
      responses:
        "200":
          description: Simulación actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Simulation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
    delete:
      tags: [Simulations]
      summary: Eliminar una simulación
      description: Con confirmación; conserva log.
      operationId: deleteSimulation
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Simulación eliminada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/simulations/{simulationId}/duplications:
    parameters:
      - $ref: "#/components/parameters/SimulationId"
    post:
      tags: [Simulations]
      summary: Duplicar una simulación
      description: Crea una copia editable para comparar alternativas. Idempotente.
      operationId: duplicateSimulation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  {
                    type: string,
                    minLength: 1,
                    maxLength: 120,
                    description: "Nombre de la copia. Si se omite, se deriva del original.",
                  }
      responses:
        "201":
          description: Simulación duplicada.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Simulation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Reuso inválido de `Idempotency-Key`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /me/simulations/{simulationId}/review:
    parameters:
      - $ref: "#/components/parameters/SimulationId"
    post:
      tags: [Simulations]
      summary: Marcar como revisada una simulación desactualizada
      description: Tras revisar los cambios de oferta, el estudiante reconfirma la simulación; vuelve a `CURRENT` si ya no hay choques ni bloqueos.
      operationId: reviewSimulation
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Resultado de la revalidación.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Persisten bloqueos (choque/crédito/requisito); no puede marcarse como vigente.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /me/simulations/{simulationId}/selections:
    parameters:
      - $ref: "#/components/parameters/SimulationId"
    get:
      tags: [Simulations]
      summary: Listar selecciones de una simulación
      operationId: listSimulationSelections
      responses:
        "200":
          description: Selecciones actuales.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SimulationSelection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Simulations]
      summary: Agregar una opción de horario a la simulación
      description: |
        Ejecuta las validaciones bloqueantes antes de agregar : materia ya aprobada
        , prerrequisito no cumplido, créditos mínimos, secuencia de
        electiva/profundización, choque horario, límite de créditos por
        programa, duplicidad y oferta archivada. Un bloqueo
        responde `409` con `problem+json`. Las advertencias no bloqueantes se
        devuelven en el cuerpo de la selección creada.
      operationId: addSimulationSelection
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/SimulationSelectionCreateRequest" }
      responses:
        "201":
          description: Selección agregada (puede incluir advertencias no bloqueantes).
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationSelection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Validación bloqueante o reuso inválido de `Idempotency-Key`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
              examples:
                prerequisiteNotMet:
                  summary: Prerrequisito no cumplido
                  value:
                    type: https://errors.local/academic/prerequisite-not-met
                    title: Prerrequisito no cumplido
                    status: 409
                    code: SIMULATION_PREREQUISITE_NOT_MET
                    detail: No puedes agregar Bases de Datos porque no registras Programación II como aprobada.
                    metadata: { requiredCourseName: Programación II }
                scheduleClash:
                  summary: Choque horario
                  value:
                    type: https://errors.local/academic/schedule-clash
                    title: Choque de horario
                    status: 409
                    code: SIMULATION_SCHEDULE_CLASH
                    detail: Programación I coincide con Francés II el miércoles entre las 18:00 y las 20:00.
                    metadata:
                      {
                        day: WEDNESDAY,
                        startsAt: "18:00",
                        endsAt: "20:00",
                        conflictingCourseName: Francés II,
                      }
                creditLimitExceeded:
                  summary: Límite de créditos por programa
                  value:
                    type: https://errors.local/academic/credit-limit-exceeded
                    title: Límite de créditos excedido
                    status: 409
                    code: SIMULATION_CREDIT_LIMIT_EXCEEDED
                    detail: Alcanzarías 25 créditos en Ingeniería de Sistemas y Computación; el límite es 23.
                    metadata:
                      {
                        programName: Ingeniería de Sistemas y Computación,
                        attemptedCredits: 25,
                        creditLimit: 23,
                      }

  /me/simulations/{simulationId}/selections/{selectionId}:
    parameters:
      - $ref: "#/components/parameters/SimulationId"
      - $ref: "#/components/parameters/SelectionId"
    delete:
      tags: [Simulations]
      summary: Quitar una selección de la simulación
      operationId: removeSimulationSelection
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          { description: Selección eliminada; resumen de créditos recalculado. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

