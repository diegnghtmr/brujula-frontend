            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /admin/staff/{staffId}:
    parameters:
      - $ref: "#/components/parameters/StaffId"
    get:
      tags: [Administration]
      summary: Consultar una cuenta staff
      operationId: getStaff
      responses:
        "200":
          description: Cuenta staff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Administration]
      summary: Activar o desactivar una cuenta staff
      operationId: updateStaff
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffUpdateRequest" }
      responses:
        "200":
          description: Cuenta staff actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
