      summary: Crear un periodo académico
      description: No se permiten periodos duplicados. Solo periodos habilitados permiten crear ofertas. Idempotente.
      operationId: createPeriod
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicPeriodCreateRequest" }
      responses:
        "201":
          description: Periodo creado.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicPeriod" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Periodo duplicado o reuso inválido de `Idempotency-Key`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /admin/periods/{periodId}:
    parameters:
      - $ref: "#/components/parameters/PeriodId"
    patch:
      tags: [Administration]
      summary: Editar o archivar un periodo
      operationId: updatePeriod
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicPeriodUpdateRequest" }
      responses:
        "200":
          description: Periodo actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicPeriod" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }

  /admin/credit-limits:
    get:
      tags: [Administration]
      summary: Listar límites de créditos
      operationId: listCreditLimits
      parameters:
        - { name: programId, in: query, schema: { type: string, format: uuid } }
        - { name: periodId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Límites de créditos configurados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CreditLimit" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Administration]
      summary: Configurar el límite de créditos por programa y periodo
      description: |
        Valor inicial sugerido 23, configurable. Cambiar el límite
        obliga a reevaluar simulaciones existentes y marcarlas si quedan inválidas.
        Bloqueo optimista por `version`.
      operationId: setCreditLimit
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditLimitUpsertRequest" }
      responses:
        "200":
          description: Límite configurado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditLimit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /admin/allowed-email-domains:
    get:
      tags: [Administration]
      summary: Listar dominios de correo permitidos
      operationId: listAllowedEmailDomains
      responses:
        "200":
          description: Dominios habilitados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AllowedEmailDomain" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Administration]
      summary: Habilitar un dominio de correo institucional
      operationId: addAllowedEmailDomain
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [domain]
              properties:
                domain:
                  {
                    type: string,
                    format: hostname,
                    examples: [uniquindio.edu.co],
                  }
      responses:
        "201":
          description: Dominio habilitado.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowedEmailDomain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Dominio ya habilitado.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /admin/allowed-email-domains/{domainId}:
    parameters:
      - $ref: "#/components/parameters/DomainId"
    delete:
      tags: [Administration]
      summary: Deshabilitar un dominio de correo
      operationId: removeAllowedEmailDomain
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Dominio deshabilitado. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ----------------------------------------------------------------------------
  # AUDIT
  # ----------------------------------------------------------------------------
  /admin/audit-events:
    get:
      tags: [Audit]
      summary: Consultar auditoría global
      description: Solo ADMIN. Eventos inmutables.
      operationId: listGlobalAuditEvents
      parameters:
        - {
            name: actorRole,
            in: query,
            schema: { $ref: "#/components/schemas/UserRole" },
          }
        - { name: action, in: query, schema: { type: string } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: Página de eventos de auditoría.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /staff/audit-events:
    get:
      tags: [Audit]
      summary: Consultar logs de cambios curriculares del programa
      description: Staff con asignación activa; solo eventos de sus programas asignados.
      operationId: listProgramAuditEvents
      parameters:
        - {
            name: programId,
            in: query,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: Página de eventos del programa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        Sesión administrada por el backend mediante cookie HttpOnly (Spring Session JDBC),
        emitida tras el flujo OIDC con Keycloak. La SPA no almacena access tokens
        . Las operaciones de escritura exigen además la cabecera CSRF `X-XSRF-TOKEN`.

  parameters:
    PageParam:
      name: page
      in: query
      description: Número de página (0-based).
      schema: { type: integer, minimum: 0, default: 0 }
    SizeParam:
      name: size
      in: query
      description: Tamaño de página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SortParam:
      name: sort
      in: query
      description: "Ordenamiento `campo,(asc|desc)`. Puede repetirse."
      style: form
      explode: true
      schema:
        type: array
        items: { type: string }
      example: ["createdAt,desc"]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave única del comando; reintentos con misma clave y cuerpo devuelven el resultado previo.
      schema: { type: string, format: uuid }
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Token CSRF para operaciones de escritura.
      schema: { type: string }
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SimulationId:
      name: simulationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SelectionId:
      name: selectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProgramId:
      name: programId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequirementId:
      name: requirementId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TrackId:
      name: trackId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModalityId:
      name: modalityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OfferingId:
      name: offeringId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OptionId:
      name: optionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PeriodId:
      name: periodId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StaffId:
      name: staffId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DomainId:
      name: domainId
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    Location:
      description: URI del recurso creado.
      schema: { type: string, format: uri-reference }

  responses:
    BadRequest:
      description: Solicitud malformada o parámetros inválidos.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Unauthorized:
      description: No autenticado o sesión expirada.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Forbidden:
      description: Autenticado pero sin permiso para el recurso (rol o propiedad).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    NotFound:
      description: Recurso inexistente o no visible para el usuario.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    VersionConflict:
      description: Conflicto de concurrencia; la versión enviada es anterior a la persistida.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
          example:
            type: https://errors.local/concurrency/version-conflict
            title: Conflicto de versión
            status: 409
            code: OPTIMISTIC_LOCK_CONFLICT
            detail: El recurso fue modificado por otra operación. Recarga y vuelve a intentar.
    UnprocessableEntity:
      description: Entidad sintácticamente válida pero que viola una regla de negocio.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    PayloadTooLarge:
      description: Archivo de importación supera el tamaño máximo.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    UnsupportedMediaType:
      description: Formato de archivo no permitido (solo.xlsx o.json).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }

  schemas:
    # --- Primitivos / comunes ------------------------------------------------
    Version:
      type: integer
      format: int64
      minimum: 0
      description: Versión para bloqueo optimista.
    InstitutionalEmail:
      type: string
      format: email
      maxLength: 254
      description: Correo institucional con dominio habilitado.
      examples: [estudiante@uniquindio.edu.co]
    Grade:
      type: number
      format: double
      minimum: 0.0
      maximum: 5.0
      multipleOf: 0.1
      description: Nota definitiva 0.0–5.0 con una cifra decimal.
    Weekday:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
    LocalTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: Hora local HH:mm de 24 horas.
      examples: ["18:00"]
    UserRole:
      type: string
      enum: [STUDENT, STAFF, ADMIN]
      description: Roles globales.
    AccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE, PENDING_VERIFICATION]
    ProgramStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    PlanStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
      description: Borrador, activo o archivado.
    CourseType:
      type: string
      enum:
        [
          REQUIRED,
          PERSONAL_ELECTIVE,
          DEEPENING,
          DEGREE_WORK,
          INSTITUTIONAL,
          OPTIONAL,
        ]
      description: Tipos de materia.
    CourseStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED]
      description: Estado de materia.
    RequirementType:
      type: string
      enum: [COURSE_PASSED, SEQUENCE, MINIMUM_CREDITS, CONFIGURABLE]
      description: Tipos de requisito.
    SequentialTrackKind:
      type: string
      enum: [PERSONAL_ELECTIVE, DEEPENING]
    PeriodStatus:
      type: string
      enum: [UPCOMING, ACTIVE, CLOSED, ARCHIVED]
      description: Próximo, activo, cerrado o archivado.
    OfferingStatus:
      type: string
      enum: [DRAFT, PRELIMINARY, FINAL, ARCHIVED]
      description: Estados de publicación de oferta.
    AttemptStatus:
      type: string
      enum: [PASSED, FAILED, CANCELLED]
      description: Estados de intento cursado.
    CourseProgressStatus:
      type: string
      enum: [PENDING, PASSED, FAILED, CANCELLED, AVAILABLE, BLOCKED]
      description: Estado curricular visual.
    SimulationStatus:
      type: string
      enum: [CURRENT, OUTDATED]
      description: Vigente o desactualizada.
    ImportKind:
      type: string
      enum: [COURSES, REQUIREMENTS, OFFERINGS]
    ImportStatus:
      type: string
      enum: [VALIDATED, INVALID, CONFIRMED]
    VersionedAction:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { $ref: "#/components/schemas/Version" }

    ProblemDetail:
      type: object
      description: Error conforme a RFC 9457 (application/problem+json) con extensiones.
      properties:
        type: { type: string, format: uri, default: about:blank }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          description: Código estable de error de dominio (p. ej. SIMULATION_SCHEDULE_CLASH).
        errors:
          type: array
          description: Errores de validación por campo.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        metadata:
          type: object
          additionalProperties: true
          description: Datos contextuales para componer el mensaje al usuario.
      required: [title, status]

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    # --- Identity / profile --------------------------------------------------
    CurrentUser:
      type: object
      required: [id, fullName, email, role, status, onboardingCompleted]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { $ref: "#/components/schemas/InstitutionalEmail" }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/AccountStatus" }
        onboardingCompleted: { type: boolean }
        assignedProgramIds:
          type: array
          description: Programas asignados (solo STAFF).
          items: { type: string, format: uuid }

    StudentRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        [fullName, email, acceptedTerms, acceptedDataProcessing]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 160 }
        email: { $ref: "#/components/schemas/InstitutionalEmail" }
        # OPTION A (DT-011): backend NEVER handles a password. Keycloak sends an
        # UPDATE_PASSWORD action-email so the user sets their credential on Keycloak's page.
        # password and passwordConfirmation fields are intentionally absent from this contract.
        acceptedTerms:
          type: boolean
          description: >
            Aceptación de términos de uso. Must be true;
            requests with false are rejected (422).
        acceptedDataProcessing:
          type: boolean
          description: >
            Aceptación de tratamiento de datos personales. Must be true;
            requests with false are rejected (422).

    RegistrationAccepted:
      type: object
      required: [userId, status]
      properties:
        userId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/AccountStatus" }
        message:
          type: string
          examples:
            [
              "Te enviamos un correo de verificación. Revisa tu bandeja para activar la cuenta.",
            ]

    # --- Subscriptions -------------------------------------------------------
    Subscription:
      type: object
      required:
        [
          id,
          programId,
          programName,
          planId,
          planName,
          referenceJourney,
          version,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        programId: { type: string, format: uuid }
        programName: { type: string }
        planId: { type: string, format: uuid }
        planName: { type: string }
        referenceJourney:
          $ref: "#/components/schemas/JourneyRef"
        version: { $ref: "#/components/schemas/Version" }
        createdAt: { type: string, format: date-time }
    SubscriptionCreateRequest:
      type: object
      additionalProperties: false
      required: [programId, planId, referenceJourneyCode]
      properties:
        programId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        referenceJourneyCode:
          {
            type: string,
            description: Código de jornada de referencia.,
          }
    SubscriptionUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        planId:
          {
            type: string,
            format: uuid,
            description: "Nuevo plan (requiere confirmación de impacto).",
          }
        referenceJourneyCode: { type: string }
        acknowledgeHistoryImpact:
          type: boolean
          default: false
          description: Confirma que entiende el impacto del cambio de plan en historial y simulaciones.
        version: { $ref: "#/components/schemas/Version" }

    # --- Progress ------------------------------------------------------------
    ProgressSummary:
      type: object
      description: Resumen de avance estimado y autodeclarado.
      required:
        [
          subscriptionId,
          programName,
          totalPlanCredits,
          approvedCredits,
          pendingCredits,
          progressPercentage,
          passedCourses,
          pendingFailedCourses,
          disclaimer,
        ]
      properties:
        subscriptionId: { type: string, format: uuid }
        programName: { type: string }
        totalPlanCredits: { type: number, format: double, minimum: 0 }
        approvedCredits: { type: number, format: double, minimum: 0 }
        pendingCredits: { type: number, format: double, minimum: 0 }
        progressPercentage:
          { type: number, format: double, minimum: 0, maximum: 100 }
        passedCourses: { type: integer, minimum: 0 }
        pendingFailedCourses:
          type: integer
          minimum: 0
          description: Materias reprobadas pendientes de repetición.
        estimatedHistoricalAverage:
          type: [number, "null"]
          format: double
          minimum: 0.0
          maximum: 5.0
          description: Promedio histórico estimado del programa.
        averagesByPeriod:
          type: array
          items: { $ref: "#/components/schemas/PeriodAverage" }
        disclaimer:
          type: string
          examples:
            [
              "Promedio estimado basado en información que registraste; no es oficial.",
            ]
    PeriodAverage:
      type: object
      required: [periodId, periodName, estimatedAverage]
      properties:
        periodId: { type: string, format: uuid }
        periodName: { type: string, examples: ["2026-1"] }
        estimatedAverage:
          { type: number, format: double, minimum: 0.0, maximum: 5.0 }

    CurriculumView:
      type: object
      required: [subscriptionId, referenceJourney, semesters]
      properties:
        subscriptionId: { type: string, format: uuid }
        referenceJourney: { $ref: "#/components/schemas/JourneyRef" }
        semesters:
          type: array
          items:
            type: object
            required: [recommendedSemester, courses]
            properties:
              recommendedSemester: { type: integer, minimum: 1 }
              courses:
                type: array
                items: { $ref: "#/components/schemas/CurriculumCourse" }
    CurriculumCourse:
      type: object
      required: [courseId, name, credits, type, progressStatus]
      properties:
        courseId: { type: string, format: uuid }
        officialCode: { type: [string, "null"] }
        name: { type: string }
        credits: { type: number, format: double, minimum: 0 }
        type: { $ref: "#/components/schemas/CourseType" }
        progressStatus: { $ref: "#/components/schemas/CourseProgressStatus" }
        unmetRequirements:
          type: array
          description: Requisitos faltantes cuando el estado es BLOCKED.
          items: { type: string }

    CourseAttempt:
      type: object
      required:
        [
          id,
          subscriptionId,
          courseId,
          courseName,
          periodId,
          journeyCode,
          status,
          registeredAt,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        courseName: { type: string }
        periodId: { type: string, format: uuid }
        periodName: { type: string }
        journeyCode:
          { type: string, description: Jornada real cursada. }
        status: { $ref: "#/components/schemas/AttemptStatus" }
        finalGrade:
          anyOf: [{ $ref: "#/components/schemas/Grade" }, { type: "null" }]
          description: Requerida para PASSED/FAILED, nula para CANCELLED.
        registeredAt: { type: string, format: date-time }
        version: { $ref: "#/components/schemas/Version" }
    CourseAttemptCreateRequest:
      type: object
      additionalProperties: false
      required: [subscriptionId, courseId, periodId, journeyCode, status]
      properties:
        subscriptionId: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        periodId: { type: string, format: uuid }
        journeyCode: { type: string }
        status: { $ref: "#/components/schemas/AttemptStatus" }
        finalGrade:
          anyOf: [{ $ref: "#/components/schemas/Grade" }, { type: "null" }]
      examples:
        - subscriptionId: 3f3f0000-0000-4000-8000-0000000000e1
          courseId: a1a10000-0000-4000-8000-000000000077
          periodId: c2c20000-0000-4000-8000-000000000090
          journeyCode: NOCTURNA
          status: PASSED
          finalGrade: 4.2
    CourseAttemptUpdateRequest:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        periodId: { type: string, format: uuid }
        journeyCode: { type: string }
        status: { $ref: "#/components/schemas/AttemptStatus" }
        finalGrade:
          anyOf: [{ $ref: "#/components/schemas/Grade" }, { type: "null" }]
        version: { $ref: "#/components/schemas/Version" }

    # --- Simulations ---------------------------------------------------------
    Simulation:
      type: object
      required:
        [
          id,
          name,
          periodId,
          periodName,
          programIds,
          status,
          createdAt,
          updatedAt,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        periodId: { type: string, format: uuid }
        periodName: { type: string }
        programIds:
          type: array
          minItems: 1
          maxItems: 2
          items: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/SimulationStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { $ref: "#/components/schemas/Version" }
    SimulationDetail:
      allOf:
        - $ref: "#/components/schemas/Simulation"
        - type: object
          required: [selections, creditSummary, weeklySchedule, validation]
          properties:
            selections:
              type: array
              items: { $ref: "#/components/schemas/SimulationSelection" }
            creditSummary:
              type: array
              description: Resumen de créditos por programa.
              items: { $ref: "#/components/schemas/ProgramCreditSummary" }
            totalWeeklyHours: { type: number, format: double, minimum: 0 }
            weeklySchedule:
              type: array
              description: Sesiones para render del calendario semanal.
              items: { $ref: "#/components/schemas/WeeklyScheduleEntry" }
            validation: { $ref: "#/components/schemas/SimulationValidation" }
    SimulationCreateRequest:
      type: object
      additionalProperties: false
      required: [name, periodId, programIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        periodId: { type: string, format: uuid }
        programIds:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, format: uuid }
    SimulationUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        version: { $ref: "#/components/schemas/Version" }
    SimulationSelection:
      type: object
      required:
        [
          id,
          offeringId,
          scheduleOptionId,
          courseId,
          courseName,
          programId,
          credits,
          journeyCode,
          offeringStatus,
          sessions,
        ]
      properties:
        id: { type: string, format: uuid }
        offeringId: { type: string, format: uuid }
        scheduleOptionId: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        courseName: { type: string }
        programId: { type: string, format: uuid }
        credits: { type: number, format: double, minimum: 0 }
        journeyCode: { type: string }
        offeringStatus: { $ref: "#/components/schemas/OfferingStatus" }
        selectedOfferingVersion:
          allOf: [{ $ref: "#/components/schemas/Version" }]
          description: Snapshot de la versión de oferta al seleccionar (detecta desactualización).
        sessions:
          type: array
          items: { $ref: "#/components/schemas/ScheduleSession" }
        warnings:
          type: array
          description: Advertencias no bloqueantes asociadas.
          items: { $ref: "#/components/schemas/ValidationNotice" }
    SimulationSelectionCreateRequest:
      type: object
      additionalProperties: false
      required: [scheduleOptionId]
      properties:
        scheduleOptionId: { type: string, format: uuid }
        acknowledgeWarnings:
          type: boolean
          default: false
          description: Confirma agregar pese a advertencias no bloqueantes.
    ProgramCreditSummary:
      type: object
      required:
        [programId, programName, selectedCredits, creditLimit, withinLimit]
      properties:
        programId: { type: string, format: uuid }
        programName: { type: string }
        selectedCredits: { type: number, format: double, minimum: 0 }
        creditLimit:
          {
            type: integer,
            minimum: 0,
            description: Límite configurado para programa y periodo.,
          }
        withinLimit: { type: boolean }
    WeeklyScheduleEntry:
      type: object
      required: [day, startsAt, endsAt, courseName, programId]
      properties:
        day: { $ref: "#/components/schemas/Weekday" }
        startsAt: { $ref: "#/components/schemas/LocalTime" }
        endsAt: { $ref: "#/components/schemas/LocalTime" }
        courseName: { type: string }
        programId: { type: string, format: uuid }
        selectionId: { type: string, format: uuid }
        inClash:
          {
            type: boolean,
            default: false,
            description: Marca de choque para resaltar el bloque.,
          }
    SimulationValidation:
      type: object
      required: [blocking, warnings]
      properties:
        blocking:
          type: array
          description: Validaciones bloqueantes activas.
          items: { $ref: "#/components/schemas/ValidationNotice" }
        warnings:
          type: array
          description: Advertencias no bloqueantes.
          items: { $ref: "#/components/schemas/ValidationNotice" }
    ValidationNotice:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estable de la validación o advertencia que el cliente mapea a su mensaje.
          examples: [SCHEDULE_CLASH, PRELIMINARY_OFFERING]
        message:
          {
            type: string,
            description: Mensaje orientador para el usuario.,
          }
        metadata:
          type: object
          additionalProperties: true

    # --- Catalog -------------------------------------------------------------
    Program:
      type: object
      required: [id, name, faculty, status, availableJourneys, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        faculty: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ProgramStatus" }
        availableJourneys:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/JourneyRef" }
        version: { $ref: "#/components/schemas/Version" }
    ProgramCreateRequest:
      type: object
      additionalProperties: false
      required: [name, faculty, availableJourneyCodes]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        faculty: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        availableJourneyCodes:
          type: array
          minItems: 1
          items: { type: string }
    ProgramUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        faculty: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 2000 }
        status: { $ref: "#/components/schemas/ProgramStatus" }
        availableJourneyCodes:
          type: array
          minItems: 1
          items: { type: string }
        version: { $ref: "#/components/schemas/Version" }

    Journey:
      type: object
      required: [id, code, name, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [DIURNA, NOCTURNA] }
        name: { type: string }
        active: { type: boolean }
    JourneyRef:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    JourneyCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          {
            type: string,
            minLength: 2,
            maxLength: 40,
            pattern: "^[A-Z][A-Z0-9_]*$",
          }
        name: { type: string, minLength: 1, maxLength: 80 }

    StudyPlan:
      type: object
      required:
        [id, programId, name, status, totalCredits, applicableJourneys, version]
      properties:
        id: { type: string, format: uuid }
        programId: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: "#/components/schemas/PlanStatus" }
        totalCredits: { type: integer, minimum: 0 }
        applicableJourneys:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/JourneyRef" }
        referenceYear: { type: [integer, "null"] }
        version: { $ref: "#/components/schemas/Version" }
    StudyPlanCreateRequest:
      type: object
      additionalProperties: false
      required: [name, totalCredits, applicableJourneyCodes]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        totalCredits: { type: integer, minimum: 0 }
        applicableJourneyCodes:
          type: array
          minItems: 1
          items: { type: string }
        referenceYear: { type: integer }
    StudyPlanUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        totalCredits: { type: integer, minimum: 0 }
        applicableJourneyCodes:
          type: array
          minItems: 1
          items: { type: string }
        referenceYear: { type: [integer, "null"] }
        version: { $ref: "#/components/schemas/Version" }

    # --- Curriculum ----------------------------------------------------------
    Course:
      type: object
      required:
        [
          id,
          planId,
          programId,
          name,
          type,
          credits,
          curricularWeeklyHours,
          status,
          version,
        ]
      properties:
        id:
          {
            type: string,
            format: uuid,
            description: Identificador interno único.,
          }
        planId: { type: string, format: uuid }
        programId: { type: string, format: uuid }
        officialCode:
          {
            type: [string, "null"],
            description: Código oficial opcional.,
          }
        name: { type: string }
        type: { $ref: "#/components/schemas/CourseType" }
        credits:
          {
            type: number,
            format: double,
            minimum: 0,
            description: No negativos.,
          }
        curricularWeeklyHours:
          {
            type: number,
            format: double,
            minimum: 0,
            description: Intensidad horaria curricular.,
          }
        enableable:
          {
            type: [boolean, "null"],
            description: Indicación opcional de si es habilitable.,
          }
        status: { $ref: "#/components/schemas/CourseStatus" }
        recommendedSemesters:
          type: array
          description: Semestre recomendado por jornada (puede variar, RN).
          items: { $ref: "#/components/schemas/RecommendedSemester" }
        version: { $ref: "#/components/schemas/Version" }
    RecommendedSemester:
      type: object
      required: [journeyCode, semester]
      properties:
        journeyCode: { type: string }
        semester: { type: integer, minimum: 1 }
    CourseCreateRequest:
      type: object
      additionalProperties: false
      required: [name, type, credits, curricularWeeklyHours]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        officialCode: { type: string, maxLength: 40 }
        type: { $ref: "#/components/schemas/CourseType" }
        credits: { type: number, format: double, minimum: 0 }
        curricularWeeklyHours: { type: number, format: double, minimum: 0 }
        enableable: { type: boolean }
        recommendedSemesters:
          type: array
          items: { $ref: "#/components/schemas/RecommendedSemester" }
    CourseUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        officialCode: { type: [string, "null"], maxLength: 40 }
        type: { $ref: "#/components/schemas/CourseType" }
        credits: { type: number, format: double, minimum: 0 }
        curricularWeeklyHours: { type: number, format: double, minimum: 0 }
        enableable: { type: [boolean, "null"] }
        status: { $ref: "#/components/schemas/CourseStatus" }
        recommendedSemesters:
          type: array
          items: { $ref: "#/components/schemas/RecommendedSemester" }
        version: { $ref: "#/components/schemas/Version" }

    CourseRequirement:
      type: object
      required: [id, targetCourseId, type, status, version]
      properties:
        id: { type: string, format: uuid }
        targetCourseId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/RequirementType" }
        requiredCourseId:
          type: [string, "null"]
          format: uuid
          description: Materia requerida para COURSE_PASSED/SEQUENCE.
        requiredCredits:
          type: [integer, "null"]
          minimum: 0
          description: Créditos mínimos para MINIMUM_CREDITS.
        simultaneityAllowed:
          type: [boolean, "null"]
          description: Permite simultaneidad en secuencias.
        confidence:
          type: [string, "null"]
          enum: [HIGH, MEDIUM, LOW, null]
          description: Confianza de la arista inferida (sugerido vs bloqueante; interpretado por el simulador).
        inferred:
          type: [boolean, "null"]
          description: Marca aristas no oficiales/inferidas.
        status: { $ref: "#/components/schemas/CourseStatus" }
        version: { $ref: "#/components/schemas/Version" }
    CourseRequirementCreateRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/RequirementType" }
        requiredCourseId: { type: string, format: uuid }
        requiredCredits: { type: integer, minimum: 0 }
        simultaneityAllowed: { type: boolean }
    CourseRequirementUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        type: { $ref: "#/components/schemas/RequirementType" }
        requiredCourseId: { type: [string, "null"], format: uuid }
        requiredCredits: { type: [integer, "null"], minimum: 0 }
        simultaneityAllowed: { type: [boolean, "null"] }
        status: { $ref: "#/components/schemas/CourseStatus" }
        version: { $ref: "#/components/schemas/Version" }

    SequentialTrack:
      type: object
      required: [id, planId, kind, label, levels, version]
      properties:
        id: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/SequentialTrackKind" }
        label: { type: string, examples: ["Electiva", "Profundización"] }
        consecutiveSimultaneityAllowed:
          type: boolean
          description: Si dos niveles consecutivos pueden simularse a la vez (por plan).
        gatekeeperCourseId:
          type: [string, "null"]
          format: uuid
          description: |
            Materia requisito para ingresar al nivel 1 de esta pista (solo pistas DEEPENING).
            Nulo para pistas PERSONAL_ELECTIVE y pistas DEEPENING sin requisito definido (V014).
        levels:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SequentialTrackLevel" }
        version: { $ref: "#/components/schemas/Version" }
    SequentialTrackLevel:
      type: object
      required: [level]
      properties:
        level:
          {
            type: integer,
            minimum: 1,
            description: "Nivel (p. ej. Electiva I = 1).",
          }
        optionCourseIds:
          type: array
          description: Materias reales seleccionables en este nivel.
          items: { type: string, format: uuid }
    SequentialTrackCreateRequest:
      type: object
      additionalProperties: false
      required: [kind, label, levels]
      properties:
        kind: { $ref: "#/components/schemas/SequentialTrackKind" }
        label: { type: string, minLength: 1, maxLength: 80 }
        consecutiveSimultaneityAllowed: { type: boolean, default: false }
        levels:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/SequentialTrackLevel" }
    SequentialTrackUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        consecutiveSimultaneityAllowed: { type: boolean }
        levels:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/SequentialTrackLevel" }
        version: { $ref: "#/components/schemas/Version" }

    DegreeWorkModality:
      type: object
      required: [id, planId, name, status, version]
      properties:
        id: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        name:
          {
            type: string,
            description: Nombre visible de la modalidad.,
          }
        credits: { type: [number, "null"], format: double, minimum: 0 }
        curricularWeeklyHours:
          { type: [number, "null"], format: double, minimum: 0 }
        status: { $ref: "#/components/schemas/CourseStatus" }
        version: { $ref: "#/components/schemas/Version" }
    DegreeWorkModalityCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        credits: { type: number, format: double, minimum: 0 }
        curricularWeeklyHours: { type: number, format: double, minimum: 0 }
    DegreeWorkModalityUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        credits: { type: [number, "null"], format: double, minimum: 0 }
        curricularWeeklyHours:
          { type: [number, "null"], format: double, minimum: 0 }
        status: { $ref: "#/components/schemas/CourseStatus" }
        version: { $ref: "#/components/schemas/Version" }

    # --- Malla (plan-level curricular grid) -----------------------------------
    PlanMalla:
      type: object
      required: [planId, journeyCode, semesterBuckets, graduationRequirements]
      properties:
        planId: { type: string, format: uuid }
        journeyCode:
          type: string
          description: Código de jornada de referencia usado para agrupar semestres.
        semesterBuckets:
          type: array
          description: Semestres del plan, ordenados de menor a mayor, solo con materias ACTIVE.
          items:
            type: object
            required: [recommendedSemester, courses]
            properties:
              recommendedSemester:
                type: integer
                minimum: 1
                description: Número de semestre recomendado (base 1).
              courses:
                type: array
                items: { $ref: "#/components/schemas/MallaCourse" }
        graduationRequirements:
          type: [string, "null"]
          description: |
            Texto informativo con los requisitos de grado aplicables al plan (CUR-008 §3).
            Incluye suficiencia en lengua extranjera y Cátedra Multidisciplinar.
            No es una entidad modelada; es copia estática de carácter orientador.
    MallaRequirement:
      type: object
      description: Arista de requisito compacta incluida en cada materia de la malla (CUR-008 §2).
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/RequirementType" }
        requiredCourseId:
          type: [string, "null"]
          format: uuid
          description: UUID del curso prerrequisito (nulo para MINIMUM_CREDITS/CONFIGURABLE).
        confidence:
          type: [string, "null"]
          enum: [HIGH, MEDIUM, LOW, null]
          description: Nivel de confianza de la arista (metadata para el simulador).
        inferred:
          type: [boolean, "null"]
          description: Si la arista fue inferida y no está en el plan oficial.
        simultaneityAllowed:
          type: [boolean, "null"]
          description: Si se permite inscripción simultánea con el prerrequisito.
    MallaCourse:
      type: object
      required: [id, name, type, credits, requirements]
      properties:
        id: { type: string, format: uuid }
        officialCode: { type: [string, "null"] }
        name: { type: string }
        type: { $ref: "#/components/schemas/CourseType" }
        credits:
          type: number
          format: double
          minimum: 0
        requirements:
          type: array
          description: Aristas de requisito de esta materia (CUR-008 §2). Lista vacía si no tiene requisitos.
          items: { $ref: "#/components/schemas/MallaRequirement" }

    # --- Offerings -----------------------------------------------------------
    AcademicPeriod:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: ["2026-2"] }
        startDate: { type: [string, "null"], format: date }
        endDate: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/PeriodStatus" }
        version: { $ref: "#/components/schemas/Version" }
    AcademicPeriodCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          { type: string, pattern: "^[0-9]{4}-[0-9]$", examples: ["2026-2"] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/PeriodStatus" }
    AcademicPeriodUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        startDate: { type: [string, "null"], format: date }
        endDate: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/PeriodStatus" }
        version: { $ref: "#/components/schemas/Version" }

    Offering:
      type: object
      required: [id, courseId, courseName, programId, periodId, status, version]
      properties:
        id: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        courseName: { type: string }
        programId: { type: string, format: uuid }
        periodId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/OfferingStatus" }
        notes: { type: [string, "null"] }
        version: { $ref: "#/components/schemas/Version" }
    OfferingDetail:
      allOf:
        - $ref: "#/components/schemas/Offering"
        - type: object
          required: [scheduleOptions]
          properties:
            scheduleOptions:
              type: array
              items: { $ref: "#/components/schemas/ScheduleOption" }
            intensityWarning:
              type: boolean
              nullable: true
              description: >
                Advisory flag. Present and true when any schedule option's computed weekly hours
                do not match the curricular weekly hours for the course. Never blocks publication
                (OFFW-005). Null when not computed (read-only queries).
    OfferingCreateRequest:
      type: object
      additionalProperties: false
      required: [courseId, periodId]
      properties:
        courseId: { type: string, format: uuid }
        periodId: { type: string, format: uuid }
        notes: { type: string, maxLength: 500 }
        scheduleOptions:
          type: array
          description: Opciones iniciales opcionales; pueden agregarse luego.
          items: { $ref: "#/components/schemas/ScheduleOptionCreateRequest" }
    OfferingUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        notes: { type: [string, "null"], maxLength: 500 }
        version: { $ref: "#/components/schemas/Version" }

    ScheduleOption:
      type: object
      required:
        [id, offeringId, label, journeyCode, weeklyHours, sessions, version]
      properties:
        id: { type: string, format: uuid }
        offeringId: { type: string, format: uuid }
        label: { type: string, examples: ["A", "B", "01"] }
        journeyCode: { type: string }
        weeklyHours:
          {
            type: number,
            format: double,
            minimum: 0,
            description: Suma semanal calculada.,
          }
        sessions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ScheduleSession" }
        version: { $ref: "#/components/schemas/Version" }
    ScheduleSession:
      type: object
      required: [day, startsAt, endsAt]
      properties:
        id: { type: string, format: uuid }
        day: { $ref: "#/components/schemas/Weekday" }
        startsAt: { $ref: "#/components/schemas/LocalTime" }
        endsAt:
          allOf: [{ $ref: "#/components/schemas/LocalTime" }]
          description: Debe ser posterior a startsAt.
    ScheduleOptionCreateRequest:
      type: object
      additionalProperties: false
      required: [label, journeyCode, sessions]
      properties:
        label: { type: string, minLength: 1, maxLength: 20 }
        journeyCode: { type: string }
        sessions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [day, startsAt, endsAt]
            properties:
              day: { $ref: "#/components/schemas/Weekday" }
              startsAt: { $ref: "#/components/schemas/LocalTime" }
              endsAt: { $ref: "#/components/schemas/LocalTime" }
    ScheduleOptionUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        label: { type: string, minLength: 1, maxLength: 20 }
        journeyCode: { type: string }
        sessions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [day, startsAt, endsAt]
            properties:
              day: { $ref: "#/components/schemas/Weekday" }
              startsAt: { $ref: "#/components/schemas/LocalTime" }
              endsAt: { $ref: "#/components/schemas/LocalTime" }
        version: { $ref: "#/components/schemas/Version" }

    # --- Imports -------------------------------------------------------------
    ImportSummary:
      type: object
      required:
        [
          id,
          kind,
          programId,
          status,
          totalRows,
          validRows,
          errors,
          warnings,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ImportKind" }
        programId: { type: string, format: uuid }
        planId: { type: [string, "null"], format: uuid }
        periodId: { type: [string, "null"], format: uuid }
        status: { $ref: "#/components/schemas/ImportStatus" }
        totalRows: { type: integer, minimum: 0 }
        validRows: { type: integer, minimum: 0 }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ImportIssue" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ImportIssue" }
        createdAt: { type: string, format: date-time }
        version: { $ref: "#/components/schemas/Version" }
    ImportIssue:
      type: object
      required: [row, code, message]
      properties:
        row:
          {
            type: integer,
            minimum: 0,
            description: Fila del archivo (0 = global).,
          }
        column: { type: [string, "null"] }
        code:
          type: string
          description: Código de error/advertencia (p. ej. COURSE_NAME_MISSING, INVALID_CREDITS, CIRCULAR_SEQUENCE).
        message: { type: string }

    # --- Administration ------------------------------------------------------
    Staff:
      type: object
      required: [id, fullName, email, status, version]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        status: { $ref: "#/components/schemas/AccountStatus" }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/StaffAssignment" }
        version: { $ref: "#/components/schemas/Version" }
    StaffCreateRequest:
      type: object
      additionalProperties: false
      required: [fullName, email]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        programIds:
          type: array
          description: Asignaciones iniciales opcionales.
          items: { type: string, format: uuid }
    StaffUpdateRequest:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 160 }
        status: { $ref: "#/components/schemas/AccountStatus" }
        version: { $ref: "#/components/schemas/Version" }
    StaffAssignment:
      type: object
      required: [id, programId, programName, active, assignedAt]
      properties:
        id: { type: string, format: uuid }
        programId: { type: string, format: uuid }
        programName: { type: string }
        active: { type: boolean }
        assignedAt: { type: string, format: date-time }

    CreditLimit:
      type: object
      required: [programId, periodId, maxCredits, version]
      properties:
        programId: { type: string, format: uuid }
        periodId: { type: string, format: uuid }
        maxCredits:
          {
            type: integer,
            minimum: 1,
            description: "Límite por programa y periodo (default 23).",
          }
        version: { $ref: "#/components/schemas/Version" }
    CreditLimitUpsertRequest:
      type: object
      additionalProperties: false
      required: [programId, periodId, maxCredits]
      properties:
        programId: { type: string, format: uuid }
        periodId: { type: string, format: uuid }
        maxCredits: { type: integer, minimum: 1, maximum: 60 }
        version:
          allOf: [{ $ref: "#/components/schemas/Version" }]
          description: Requerido al actualizar un límite existente (omitir al crear).

    AllowedEmailDomain:
      type: object
      required: [id, domain]
      properties:
        id: { type: string, format: uuid }
        domain:
          { type: string, format: hostname, examples: [uniquindio.edu.co] }

    # --- Audit ---------------------------------------------------------------
    AuditEvent:
      type: object
      required: [id, actorId, actorRole, action, entityType, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        actorRole: { $ref: "#/components/schemas/UserRole" }
        action:
          {
            type: string,
            examples: [OFFERING_PUBLISHED, COURSE_ATTEMPT_UPDATED],
          }
        entityType: { type: string, examples: [Offering, CourseAttempt] }
        entityId: { type: [string, "null"], format: uuid }
        programId: { type: [string, "null"], format: uuid }
        occurredAt: { type: string, format: date-time }
        previousValue:
          type: [object, "null"]
          additionalProperties: true
          description: Valores sanitizados antes del cambio (sin secretos).
        newValue:
          type: [object, "null"]
          additionalProperties: true

    # --- Pages ---------------------------------------------------------------
    SimulationPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              {
                type: array,
                items: { $ref: "#/components/schemas/Simulation" },
              }
    CourseAttemptPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              {
                type: array,
                items: { $ref: "#/components/schemas/CourseAttempt" },
              }
    ProgramPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              { type: array, items: { $ref: "#/components/schemas/Program" } }
    CoursePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              { type: array, items: { $ref: "#/components/schemas/Course" } }
    OfferingPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              { type: array, items: { $ref: "#/components/schemas/Offering" } }
    ImportPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              {
                type: array,
                items: { $ref: "#/components/schemas/ImportSummary" },
              }
    StaffPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              { type: array, items: { $ref: "#/components/schemas/Staff" } }
    AuditEventPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [content]
          properties:
            content:
              {
                type: array,
                items: { $ref: "#/components/schemas/AuditEvent" },
              }
