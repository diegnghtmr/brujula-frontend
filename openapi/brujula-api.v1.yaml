        content:
          application/json:
            schema: { $ref: "#/components/schemas/JourneyCreateRequest" }
      responses:
        "201":
          description: Jornada creada.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Código de jornada duplicado.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /admin/staff:
    get:
      tags: [Administration]
      summary: Listar cuentas staff
      operationId: listStaff
      parameters:
        - {
            name: status,
            in: query,
            schema: { $ref: "#/components/schemas/AccountStatus" },
          }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: Página de cuentas staff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Administration]
      summary: Crear una cuenta staff
      description: Solo ADMIN. Idempotente para evitar alta duplicada. Genera log.
      operationId: createStaff
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffCreateRequest" }
      responses:
        "201":
          description: Cuenta staff creada.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Correo ya registrado o reuso inválido de `Idempotency-Key`.
