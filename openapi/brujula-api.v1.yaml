      tags: [Administration]
      summary: Retirar una asignación de programa
      operationId: revokeStaffAssignment
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Asignación retirada; genera log. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/periods:
    post:
